  <!-- scale to screen -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Domino Counter</title>
  <link rel="icon" type="image/png" href="domino_05.png">
  <style>
    /* Force body to take exactly 100% of the screen with no scrolling allowed */
    body {
      font-family: Inter, system-ui, Segoe UI, Roboto, Arial;
      margin: 0;
      padding: 0;
      background: #000000;
      color: #e6eef6;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }

    /* Universal box-sizing rule for predictable scaling */
    *, *:before, *:after {
      box-sizing: border-box;
    }

    /* App container dynamically scales to fill max width and height cleanly */
    .app {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100dvh;
      background: rgba(35, 35, 35, 0.9);
      padding: 16px;
      box-shadow: 0 10px 30px rgba(2, 6, 12, 0.6);
      text-align: center;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 22px;
    }

    /* Static sizing for header controls */
    .controls {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0; 
      margin-bottom: 12px;
    }

    /* Spans across and centers elements strictly within the remaining space */
    .controls-center {
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: center;
      gap: 8px;
      flex: 1;
    }

    /* Side-by-side layout for score and buttons */
    .total-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
    }

    /* Increased font-size and fine-tuned padding for maximum legibility */
    .total-box {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #012010;
      font-size: 68px;
      font-weight: 900;
      padding: 6px 28px;
      border-radius: 22px;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
      letter-spacing: 1px;
      border: 3px solid #15803d;
      line-height: 1;
    }

    .ctrl-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button {
      background: #06b6d4;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      color: #022428;
      cursor: pointer;
      font-weight: 600;
    }

    #resetBtn {
      background: #e11d48;
      color: #fff;
    }

    #copyBtn {
      background: #a855f7;
      color: #1a0533;
    }

    #copyBtn.copied {
      background: #9333ea;
    }

    /* CRITICAL: The grid container absorbs all remaining viewport space 
      and scales its children proportionally.
    */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0; 
    }

    /* Flex-based tiles that grow and shrink according to window size */
    .tile-button {
      background: #fff;
      color: #000;
      border-radius: 12px;
      padding: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(2, 6, 12, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      min-height: 0; 
    }

    .counter-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
    }

    .count {
      font-weight: 700;
      font-size: 16px;
    }

    /* Flex image scaling blocks images from clipping outer limits */
    .tile-image {
      flex: 1;
      width: 100%;
      background: #00000000;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
      margin-bottom: 4px;
    }

    .tile-image img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .remove-btn {
      background: #e11d48;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
    }

    .score-form {
      margin-top: 0;
      border-top: none;
      padding-top: 0;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .form-row label {
      font-size: 14px;
      color: #a0b4c8;
      min-width: 46px;
    }

    .form-row input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #e6eef6;
      padding: 4px 8px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-row input:focus {
      outline: none;
      border-color: #06b6d4;
    }

    #submitBtn {
      background: #22c55e;
      color: #012010;
      border: none;
      padding: 6px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="controls">
      
      <div class="controls-center">
        <div class="total-row">
          <div class="total-box"><span id="mainCount">0</span></div>
          <div class="ctrl-btns">
            <button id="resetBtn">Reset</button>
            <button id="copyBtn">Copy</button>
          </div>
        </div>
      </div>
      
      <div class="score-form" style="width:156px; flex-shrink:0; align-items:flex-end;">
        <div class="form-row" style="justify-content:flex-end;">
          <label for="nameInput">Name</label>
          <input type="text" id="nameInput" name="name" style="width:100px;" required>
        </div>
        <div class="form-row" style="justify-content:flex-end;">
          <label for="roundInput">Round</label>
          <input type="number" id="roundInput" name="round" min="0" max="12" value="12" style="width:55px;" required>
        </div>
        <button id="submitBtn">Update</button>
      </div>
    </div>
    
    <div class="stats" id="buttons">
      <div class="tile-button"><div class="tile-image"><img src="domino_01.png"></div><div class="counter-row"><div class="count" id="count-1">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_02.png"></div><div class="counter-row"><div class="count" id="count-2">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_03.png"></div><div class="counter-row"><div class="count" id="count-3">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_04.png"></div><div class="counter-row"><div class="count" id="count-4">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_05.png"></div><div class="counter-row"><div class="count" id="count-5">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_06.png"></div><div class="counter-row"><div class="count" id="count-6">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_07.png"></div><div class="counter-row"><div class="count" id="count-7">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_08.png"></div><div class="counter-row"><div class="count" id="count-8">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_09.png"></div><div class="counter-row"><div class="count" id="count-9">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_10.png"></div><div class="counter-row"><div class="count" id="count-10">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_11.png"></div><div class="counter-row"><div class="count" id="count-11">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button"><div class="tile-image"><img src="domino_12.png"></div><div class="counter-row"><div class="count" id="count-12">0</div><button class="remove-btn">-</button></div></div>
      <div class="tile-button" style="grid-column:2;">
        <div class="tile-image"><img src="domino_00.png"></div>
        <div class="counter-row">
          <div class="count" id="count-0">0</div>
          <button class="remove-btn">-</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const counts = {};
    let totalCount = 0;

    document.querySelectorAll('.tile-button').forEach(btn => {
      const countEl = btn.querySelector('.count');
      const removeBtn = btn.querySelector('.remove-btn');
      const tileNum = parseInt(countEl.id.split('-')[1]);
      counts[tileNum] = 0;

      btn.addEventListener('click', e => {
        if (e.target === removeBtn) return;
        counts[tileNum]++;
        totalCount += tileNum === 0 ? 50 : tileNum;
        countEl.textContent = counts[tileNum];
        document.getElementById('mainCount').textContent = totalCount;
      });

      removeBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (counts[tileNum] > 0) {
          counts[tileNum]--;
          totalCount -= tileNum === 0 ? 50 : tileNum;
          countEl.textContent = counts[tileNum];
          document.getElementById('mainCount').textContent = totalCount;
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      Object.keys(counts).forEach(k => {
        counts[k] = 0;
        document.getElementById('count-' + k).textContent = 0;
      });
      totalCount = 0;
      document.getElementById('mainCount').textContent = 0;
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(String(totalCount)).then(() => {
        btn.classList.add('copied');
        btn.textContent = 'Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = 'Copy';
        }, 1500);
      });
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value.trim();
      const roundInput = document.getElementById('roundInput');
      const round = roundInput.value;
      const amount = totalCount;

      if (!name || round === '') return;

      const cur = parseInt(roundInput.value);
      if (cur > 0) roundInput.value = cur - 1;

      const body = new URLSearchParams({ name, round, amount });

      fetch('https://domino.mrtaco.cc/increment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body.toString()
      }).catch(err => console.error('Submit failed:', err));
    });
  </script>
</body>
</html>
